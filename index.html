<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Gewichts-Tracker</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>

  <header>
    <div>
      <h1>Gewichts-Tracker</h1>
      <div class="sub" id="goal-subtitle">Profil wählen oder starten</div>
      <div class="sync-badge" id="sync-status">Bereit</div>
    </div>
    <button class="btn-ghost" id="btn-edit-goals" onclick="openSetup()">Ziele ändern</button>
  </header>

  <!-- PROFIL-UMSCHALTER INKL. STREAK-BADGES -->
  <div class="profile-switch">
    <button class="profile-btn active" id="tab-Ludwig" onclick="switchProfile('Ludwig')">Ludwig</button>
    <button class="profile-btn" id="tab-Hannah" onclick="switchProfile('Hannah')">Hannah</button>
  </div>

  <!-- SETUP ANSICHT -->
  <div id="setup-view" class="hidden">
    <div class="card">
      <div style="font-weight:700; margin-bottom:12px;" id="setup-heading">Ziel-Setup für Ludwig</div>
      <div class="grid-2">
        <div>
          <label>Startdatum</label>
          <input type="date" id="setup-start-date" />
        </div>
        <div>
          <label>Enddatum</label>
          <input type="date" id="setup-end-date" />
        </div>
        <div>
          <label>Startgewicht (kg)</label>
          <input type="number" step="0.1" inputmode="decimal" id="setup-start-weight" placeholder="85.0" />
        </div>
        <div>
          <label>Zielgewicht (kg)</label>
          <input type="number" step="0.1" inputmode="decimal" id="setup-goal-weight" placeholder="78.0" />
        </div>
      </div>
      <button class="action-btn btn-primary" onclick="saveSetup()">Ziele speichern & starten</button>
    </div>
  </div>

  <!-- TRACKING ANSICHT -->
  <div id="app-view" class="hidden">
    <div class="card">
      <div class="grid-2">
        <div>
          <label>Datum</label>
          <input type="date" id="entry-date" />
        </div>
        <div>
          <label>Gewicht (kg)</label>
          <div class="stepper">
            <button type="button" class="step-btn" onclick="stepWeight(-0.1)">−</button>
            <input type="number" step="0.1" inputmode="decimal" id="entry-weight" placeholder="82.4" />
            <button type="button" class="step-btn" onclick="stepWeight(0.1)">+</button>
          </div>
        </div>
      </div>
      <button class="action-btn btn-primary" onclick="addEntry()">Speichern & Synchronisieren</button>
    </div>

    <!-- STATUS BOX INKL. FORTSCHRITTSBALKEN -->
    <div id="status-box" class="status-box status-good">
      <div class="status-title" id="st-title">Status</div>
      <div class="status-main" id="st-diff">--</div>
      <div class="status-meta" id="st-meta">--</div>

      <div class="progress-wrapper">
        <div class="progress-labels">
          <span id="prog-pct">0 % geschafft</span>
          <span id="prog-rem">noch -- kg</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="prog-fill" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="chart-header">
        <strong style="font-size:0.95rem;">Verlauf</strong>
        <div class="zoom-switch">
          <button class="zoom-btn active" id="zoom-all" onclick="setZoom('all')">Gesamt</button>
          <button class="zoom-btn" id="zoom-30" onclick="setZoom('30')">30 Tage</button>
        </div>
      </div>
      <canvas id="weightChart"></canvas>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="font-size:0.95rem;" id="hist-heading">Letzte Messungen</strong>
        <button class="btn-ghost" onclick="exportCSV()">CSV-Backup</button>
      </div>
      <div class="hist-list" id="history-list"></div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
