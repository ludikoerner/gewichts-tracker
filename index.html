<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Gewichts-Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; max-width: 540px; margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; margin: 0; }
    .sub { font-size: 0.85rem; color: var(--muted); }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background: #f8fafc; }
    input:focus { outline: none; border-color: var(--primary); background: #fff; }
    button { border: none; border-radius: 10px; padding: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 12px; }
    .btn-primary:active { background: var(--primary-dark); transform: scale(0.99); }
    .btn-ghost { background: transparent; color: var(--muted); font-size: 0.8rem; padding: 6px 10px; text-decoration: underline; }
    .btn-danger { background: #fee2e2; color: #b91c1c; padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }
    
    /* Status Box */
    .status-box { border-radius: 12px; padding: 14px; margin-bottom: 14px; border: 1.5px solid; }
    .status-good { background: #f0fdf4; border-color: #86efac; color: #166534; }
    .status-bad { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
    .status-title { font-size: 0.85rem; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .status-main { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
    .status-meta { font-size: 0.85rem; color: #334155; line-height: 1.45; }

    /* Tabelle */
    .hist-list { max-height: 220px; overflow-y: auto; }
    .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); }
    .hist-item:last-child { border-bottom: none; }
    .hidden { display: none; }
    canvas { width: 100% !important; height: 270px !important; }
  </style>
</head>
<body>

  <!-- SETUP ANSICHT -->
  <div id="setup-view" class="hidden">
    <header>
      <div>
        <h1>Gewichts-Tracker</h1>
        <div class="sub">Einmaliges Ziel-Setup</div>
      </div>
    </header>
    <div class="card">
      <div class="grid-2">
        <div>
          <label>Startdatum</label>
          <input type="date" id="setup-start-date" />
        </div>
        <div>
          <label>Enddatum</label>
          <input type="date" id="setup-end-date" />
        </div>
        <div>
          <label>Startgewicht (kg)</label>
          <input type="number" step="0.1" inputmode="decimal" id="setup-start-weight" placeholder="85.0" />
        </div>
        <div>
          <label>Zielgewicht (kg)</label>
          <input type="number" step="0.1" inputmode="decimal" id="setup-goal-weight" placeholder="78.0" />
        </div>
      </div>
      <button class="btn-primary" onclick="saveSetup()">Ziele speichern & starten</button>
    </div>
  </div>

  <!-- TRACKING ANSICHT -->
  <div id="app-view" class="hidden">
    <header>
      <div>
        <h1>Gewichts-Tracker</h1>
        <div class="sub" id="goal-subtitle">Ziel: --</div>
      </div>
      <button class="btn-ghost" onclick="openSetup()">Ziele ändern</button>
    </header>

    <!-- Eingabe -->
    <div class="card">
      <div class="grid-2">
        <div>
          <label>Datum</label>
          <input type="date" id="entry-date" />
        </div>
        <div>
          <label>Gewicht (kg)</label>
          <input type="number" step="0.1" inputmode="decimal" id="entry-weight" placeholder="z. B. 82.4" />
        </div>
      </div>
      <button class="btn-primary" onclick="addEntry()">Speichern & Aktualisieren</button>
    </div>

    <!-- Rote / Grüne Status Box -->
    <div id="status-box" class="status-box status-good">
      <div class="status-title" id="st-title">Status</div>
      <div class="status-main" id="st-diff">--</div>
      <div class="status-meta" id="st-meta">--</div>
    </div>

    <!-- Graph -->
    <div class="card">
      <canvas id="weightChart"></canvas>
    </div>

    <!-- Historie & Löschen -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="font-size:0.95rem;">Letzte Messungen</strong>
        <button class="btn-ghost" onclick="exportCSV()">CSV-Backup</button>
      </div>
      <div class="hist-list" id="history-list"></div>
    </div>
  </div>

<script>
  // --- PWA MANIFEST & ICON DYNAMISCH INJECTEN ---
  (function setupPWA() {
    const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="110" fill="#2563eb"/>
      <path d="M110 340 L200 240 L280 285 L402 155" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="402" cy="155" r="26" fill="#4ade80"/>
    </svg>`;
    const iconUrl = "data:image/svg+xml;base64," + btoa(svgIcon);

    const manifest = {
      name: "Gewichts-Tracker",
      short_name: "Gewicht",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#f1f5f9",
      theme_color: "#2563eb",
      icons: [
        { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
        { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);

    const appleIcon = document.createElement("link");
    appleIcon.rel = "apple-touch-icon";
    appleIcon.href = iconUrl;
    document.head.appendChild(appleIcon);
  })();

  // --- APP LOGIK ---
  const STORAGE_GOALS = "wt_goals_v1";
  const STORAGE_ENTRIES = "wt_entries_v1";
  let chartInstance = null;

  function formatDE(isoDate) {
    const [y, m, d] = isoDate.split("-");
    return `${d}.${m}.${y}`;
  }

  function todayISO() {
    return new Date().toISOString().split("T")[0];
  }

  function getGoals() {
    const raw = localStorage.getItem(STORAGE_GOALS);
    return raw ? JSON.parse(raw) : null;
  }

  function getEntries() {
    const raw = localStorage.getItem(STORAGE_ENTRIES);
    const list = raw ? JSON.parse(raw) : [];
    return list.sort((a, b) => a.date.localeCompare(b.date));
  }

  function init() {
    const goals = getGoals();
    if (!goals) {
      openSetup();
    } else {
      showApp();
    }
  }

  function openSetup() {
    document.getElementById("setup-view").classList.remove("hidden");
    document.getElementById("app-view").classList.add("hidden");
    const goals = getGoals();
    document.getElementById("setup-start-date").value = goals ? goals.startDate : todayISO();
    document.getElementById("setup-end-date").value = goals ? goals.endDate : "2026-12-31";
    document.getElementById("setup-start-weight").value = goals ? goals.startWeight : "";
    document.getElementById("setup-goal-weight").value = goals ? goals.goalWeight : "";
  }

  function saveSetup() {
    const startDate = document.getElementById("setup-start-date").value;
    const endDate = document.getElementById("setup-end-date").value;
    const startWeight = parseFloat(document.getElementById("setup-start-weight").value);
    const goalWeight = parseFloat(document.getElementById("setup-goal-weight").value);

    if (!startDate || !endDate || isNaN(startWeight) || isNaN(goalWeight) || endDate <= startDate) {
      alert("Bitte prüfe Datum und Gewichtsangaben!");
      return;
    }

    localStorage.setItem(STORAGE_GOALS, JSON.stringify({ startDate, endDate, startWeight, goalWeight }));
    
    const entries = getEntries();
    if (!entries.some(e => e.date === startDate)) {
      entries.push({ date: startDate, weight: startWeight });
      localStorage.setItem(STORAGE_ENTRIES, JSON.stringify(entries));
    }
    showApp();
  }

  function showApp() {
    document.getElementById("setup-view").classList.add("hidden");
    document.getElementById("app-view").classList.remove("hidden");
    document.getElementById("entry-date").value = todayISO();
    
    const goals = getGoals();
    document.getElementById("goal-subtitle").innerText = `Ziel: ${goals.goalWeight.toFixed(1)} kg bis ${formatDE(goals.endDate)}`;
    
    renderAll();
  }

  function addEntry() {
    const date = document.getElementById("entry-date").value;
    const weight = parseFloat(document.getElementById("entry-weight").value);
    if (!date || isNaN(weight)) {
      alert("Bitte gültiges Datum und Gewicht eingeben.");
      return;
    }

    let entries = getEntries().filter(e => e.date !== date);
    entries.push({ date, weight });
    localStorage.setItem(STORAGE_ENTRIES, JSON.stringify(entries));
    document.getElementById("entry-weight").value = "";
    renderAll();
  }

  function deleteEntry(date) {
    if (!confirm(`Messung vom ${formatDE(date)} löschen?`)) return;
    const entries = getEntries().filter(e => e.date !== date);
    localStorage.setItem(STORAGE_ENTRIES, JSON.stringify(entries));
    renderAll();
  }

  function editEntry(date, weight) {
    document.getElementById("entry-date").value = date;
    document.getElementById("entry-weight").value = weight;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function calcTargetAt(dateStr, goals) {
    const dStart = new Date(goals.startDate);
    const dEnd = new Date(goals.endDate);
    const dCurr = new Date(dateStr);
    const totalDays = (dEnd - dStart) / 86400000;
    if (totalDays <= 0) return goals.goalWeight;
    const passed = (dCurr - dStart) / 86400000;
    return goals.startWeight + (goals.goalWeight - goals.startWeight) * (passed / totalDays);
  }

  function renderAll() {
    const goals = getGoals();
    const entries = getEntries();

    const histEl = document.getElementById("history-list");
    histEl.innerHTML = [...entries].reverse().map(e => `
      <div class="hist-item">
        <div onclick="editEntry('${e.date}', ${e.weight})" style="cursor:pointer;">
          <strong>${formatDE(e.date)}</strong> &nbsp;·&nbsp; ${e.weight.toFixed(1)} kg
        </div>
        <button class="btn-danger" onclick="deleteEntry('${e.date}')">Löschen</button>
      </div>
    `).join("");

    if (entries.length === 0) return;

    const latest = entries[entries.length - 1];
    const targetToday = calcTargetAt(latest.date, goals);
    const diff = latest.weight - targetToday;
    const isLossGoal = goals.goalWeight <= goals.startWeight;
    const onTrack = isLossGoal ? diff <= 0 : diff >= 0;

    const last7 = entries.slice(-7);
    const avg7 = last7.reduce((s, e) => s + e.weight, 0) / last7.length;

    const trendValues = entries.map((_, i) => {
      const slice = entries.slice(Math.max(0, i - 6), i + 1);
      return slice.reduce((s, e) => s + e.weight, 0) / slice.length;
    });

    let rateText = "Tempo: mind. 2 Messungen nötig";
    let prognosisPoint = null;

    if (entries.length >= 2) {
      const winLen = Math.min(7, entries.length);
      const dRef = new Date(entries[entries.length - winLen].date);
      const dLast = new Date(latest.date);
      const daysDiff = (dLast - dRef) / 86400000;
      const gRef = trendValues[trendValues.length - winLen];
      const gLast = trendValues[trendValues.length - 1];

      if (daysDiff > 0) {
        const slopePerDay = (gLast - gRef) / daysDiff;
        const weekRate = slopePerDay * 7;
        const kcalPerDay = Math.round(slopePerDay * 7000);
        const kcalLabel = kcalPerDay < 0 ? `Ø ${Math.abs(kcalPerDay)} kcal Defizit/Tag` : `Ø +${kcalPerDay} kcal Überschuss/Tag`;
        rateText = `Tempo: ${weekRate >= 0 ? "+" : ""}${weekRate.toFixed(2)} kg/Woche · ${kcalLabel}`;

        const remDays = (new Date(goals.endDate) - dLast) / 86400000;
        if (remDays > 0) {
          prognosisPoint = { date: goals.endDate, weight: gLast + slopePerDay * remDays };
        }
      }
    }

    const box = document.getElementById("status-box");
    box.className = `status-box ${onTrack ? "status-good" : "status-bad"}`;
    document.getElementById("st-title").innerText = `Status vom ${formatDE(latest.date)}`;
    const sign = diff > 0 ? "+" : "";
    const label = onTrack ? (isLossGoal ? "leichter als Soll" : "im Plan") : (isLossGoal ? "schwerer als Soll" : "unter Soll");
    document.getElementById("st-diff").innerText = `${sign}${diff.toFixed(2)} kg (${label})`;
    document.getElementById("st-meta").innerHTML = `Soll: <strong>${targetToday.toFixed(2)} kg</strong> · Ø letzte ${last7.length}: <strong>${avg7.toFixed(2)} kg</strong><br>${rateText}`;

    // 3. Chart.js Diagramm mit echter Zeitachse
    const sollData = [
      { x: goals.startDate, y: goals.startWeight },
      { x: goals.endDate, y: goals.goalWeight }
    ];

    const istData = entries.map(e => ({ x: e.date, y: e.weight }));

    const trendData = entries.map((e, idx) => ({
      x: e.date,
      y: trendValues[idx]
    }));

    const progData = prognosisPoint
      ? [
          { x: latest.date, y: trendValues[trendValues.length - 1] },
          { x: prognosisPoint.date, y: prognosisPoint.weight }
        ]
      : [];

    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById("weightChart").getContext("2d");
    chartInstance = new Chart(ctx, {
      type: "line",
      data: {
        datasets: [
          { label: "Soll", data: sollData, borderColor: "#94a3b8", borderDash: [6, 6], borderWidth: 2, pointRadius: 0 },
          { label: "Messwerte", data: istData, borderColor: "#2563eb", backgroundColor: "#2563eb", borderWidth: 1.5, pointRadius: 3 },
          { label: "7-Tage-Trend", data: trendData, borderColor: "#f97316", borderWidth: 2.8, pointRadius: 0 },
          { label: "Prognose", data: progData, borderColor: "#f97316", borderDash: [4, 4], borderWidth: 2, pointRadius: 0 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "top", labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: {
            callbacks: {
              title: (items) => formatDE(items[0].raw.x)
            }
          }
        },
        scales: {
          x: {
            type: "time",
            time: {
              unit: "day",
              tooltipFormat: "dd.MM.yyyy"
            },
            ticks: {
              maxTicksLimit: 6,
              font: { size: 10 },
              callback: function(value) {
                const d = new Date(value);
                return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
              }
            }
          },
          y: {
            ticks: { font: { size: 10 } }
          }
        }
      }
    });
  }

  function exportCSV() {
    const entries = getEntries();
    let csv = "Datum;Gewicht\n" + entries.map(e => `${formatDE(e.date)};${e.weight}`).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "gewichts_backup.csv";
    a.click();
  }

  init();
</script>
</body>
</html>
